image: node:lts

stages:
  - build
  - deploy

# ── Build ────────────────────────────────────────────────────────────────────
build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    # Pass dist/ to the deploy job
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── Deploy to GitLab Pages ───────────────────────────────────────────────────
# GitLab Pages requires the artifact to live in a directory named `public/`.
# We simply rename the Vite output.
pages:
  stage: deploy
  needs: [build]
  script:
    # Rename the Vite output directory to `public/` as required by GitLab Pages.
    # The source `public/` folder (favicon, logo) was already copied into dist/
    # by Vite during build, so there is no conflict.
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://$CI_PAGES_NAMESPACE.gitlab.io/$CI_PROJECT_PATH
